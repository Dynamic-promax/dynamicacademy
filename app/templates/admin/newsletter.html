{% extends "admin/_layout.html" %}
{% block admin_title %}Newsletter Subscribers{% endblock %}
{% block admin_content %}
<div class="table-wrap">
  <table class="data-table">
    <thead><tr><th>Email</th><th>Subscribed</th></tr></thead>
    <tbody>
      {% for s in subscribers %}
      <tr><td>{{ s.email }}</td><td>{{ s.subscribed_at.strftime('%d %b %Y') }}</td></tr>
      {% else %}
      <tr><td colspan="2" class="empty-state">No subscribers yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
